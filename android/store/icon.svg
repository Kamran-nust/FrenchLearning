  </g>
  <path d="M43,41 H65 L51,69" fill="none" stroke="#F5B841" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50.5,55.5 H64" fill="none" stroke="#EDE7DA" stroke-width="5" stroke-linecap="round"/>
