name: CI

# Runs on every push and pull request: lint, formatting, unit tests and a
# production build. A red X on GitHub means something needs fixing before it
# is worth deploying. (Vercel still deploys on push; this tells you if that
# deploy is a good one.)

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
